# Lab guides are code too: every fenced bash/hcl block must parse, and every stage must be
# formatted and valid. Runs on every push and PR with no cloud access at all.
name: guide-ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false
      - name: Install conftest
        run: |
          curl -sSL https://github.com/open-policy-agent/conftest/releases/download/v0.56.0/conftest_0.56.0_Linux_x86_64.tar.gz | tar xz conftest
          sudo mv conftest /usr/local/bin/
      - run: ./self-check.sh --ci
